name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Install the affected DSH release
        run: npm install --no-save --package-lock=false @deepseek-ai/dsh@0.1.0-rc.6
      - name: Run integration tests against DSH rc.6
        run: npm run test:integration
        env:
          DSH_INSTALL_DIR: ${{ github.workspace }}
